<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devin Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Andeas Store</h1>
        <p>Belanja kebutuhan sehari-hari dengan mudah dan simple</p>
    </header>

    <main>
        <section class="bagian">
            <h2>Daftar Kebutuhan</h2>
            <div id="product-list" class="product-grid"></div>
        </section>

        <section class="bagian">
            <h2>Keranjang Belanja</h2>

            <ul id="cart-list">
                <li class="kosong">Keranjang masih kosong.</li>
            </ul>

            <div class="total">
                <p>Jumlah barang : <strong id="total-items">0</strong></p>
                <p>Total harga : <strong id="total-price">Rp0</strong></p>
            </div>

            <div class="aksi">
                <button id="undo-button">Batalkan Isi item Terakhir</button>
                <button id="clear-button">Kosongkan Isi Keranjang</button>
                <button id="checkout-button">Beli</button>
            </div>
        </section>
    </main>

    <footer>
        <p>Devin Store &copy; 2026</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
