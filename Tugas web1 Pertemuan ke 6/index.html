<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Perulangan</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="container">
        <h1>Latihan Perulangan</h1>

        <section class="card">
            <h2>1. Menampilkan Bilangan Genap</h2>
            <p>Bilangan genap dari 1 sampai 10:</p>
            <div id="hasilGenap" class="hasil-genap"></div>
        </section>

        <section class="card">
            <h2>2. Tabel Perkalian 1–10</h2>
            <p>Tabel perkalian menggunakan perulangan bersarang.</p>
            <div class="table-wrapper">
                <table id="tabelPerkalian"></table>
            </div>
        </section>
    </main>
</body>
</html>
